<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grounded Opinion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --ink:#14101F;
  --paper:#F5F4F8;
  --surface:#FFFFFF;
  --muted:#58536B;
  --line:#14101F;
  --red:#D4281F;
  --gold:#F5B700;
  --green:#0F6B4A;
  --blue:#2B4EE0;
  --violet:#7B3FE4;
  --pink:#E04A8F;
  --teal:#0E7C86;
  --orange:#E8590C;
  --sans:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --serif:'Newsreader',Georgia,'Times New Roman',serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#F3F1F8;
    --paper:#14101F;
    --surface:#1E1930;
    --muted:#B0AAC4;
    --line:#F3F1F8;
  }
}
:root[data-theme="dark"]{
  --ink:#F3F1F8;
  --paper:#14101F;
  --surface:#1E1930;
  --muted:#B0AAC4;
  --line:#F3F1F8;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--serif);
  font-size:1.125rem;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit}
h1,h2,h3{font-family:var(--sans);margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
main:focus{outline:none}
.wrap{max-width:1180px;margin:0 auto;padding:0 clamp(1rem,4vw,2.5rem)}
.skip{position:absolute;left:-999px;top:0;background:var(--ink);color:var(--paper);padding:.6rem 1rem;font-family:var(--sans);font-weight:700;z-index:10}
.skip:focus{left:1rem;top:1rem}

/* topic colours */
.t-education{--c:var(--gold);--on:#14101F}
.t-economy{--c:var(--red);--on:#FFFFFF}
.t-work{--c:var(--green);--on:#FFFFFF}
.t-transport{--c:var(--violet);--on:#FFFFFF}
.t-housing{--c:var(--pink);--on:#14101F}
.t-foreign{--c:var(--teal);--on:#FFFFFF}
.t-parties{--c:var(--orange);--on:#14101F}

/* header */
.site-header{border-bottom:3px solid var(--line)}
.site-header .wrap{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;padding-top:1.1rem;padding-bottom:1.1rem}
.wordmark{font-family:var(--sans);font-weight:800;font-size:1.9rem;letter-spacing:-.04em;text-decoration:none;line-height:1}
nav{display:flex;align-items:center;gap:clamp(.9rem,2.5vw,1.8rem);flex-wrap:wrap;font-family:var(--sans);font-weight:700;font-size:1rem}
nav a{text-decoration:none;padding:.25rem 0;border-bottom:3px solid transparent}
nav a:hover{border-bottom-color:var(--gold)}
nav a[aria-current="page"]{border-bottom-color:var(--ink)}
nav a.btn-nav{background:var(--ink);color:var(--paper);padding:.55rem 1rem;border-bottom:0}
nav a.btn-nav:hover{background:var(--blue);color:#fff}

/* hero */
.hero{padding-block:clamp(2rem,6vw,5rem)}
.hero-grid{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:clamp(2rem,5vw,4rem);align-items:center}
.hero h1{font-weight:800;font-size:clamp(2.8rem,7.5vw,6.4rem);line-height:.92;letter-spacing:-.045em}
.hero-sub{font-size:clamp(1.15rem,2vw,1.4rem);max-width:32rem;margin:1.6rem 0 1.8rem;line-height:1.5}
.cta-row{display:flex;gap:.8rem;flex-wrap:wrap}
.btn{display:inline-block;font-family:var(--sans);font-weight:700;font-size:1.05rem;padding:.8rem 1.4rem;border:3px solid var(--ink);background:var(--ink);color:var(--paper);text-decoration:none;cursor:pointer;transition:background .15s,color .15s}
.btn:hover{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--gold);border-color:var(--ink);color:#14101F}
.placards{display:grid;gap:1.1rem}
.placard{
  display:block;text-decoration:none;
  background:var(--c);color:var(--on);
  padding:1.3rem 1.5rem 1.2rem;
  font-family:var(--sans);
  transform:rotate(var(--r));
  transition:transform .2s ease;
  animation:drop .7s cubic-bezier(.2,.8,.2,1) backwards;
}
.placard:nth-child(1){--r:-2.5deg;animation-delay:.05s}
.placard:nth-child(2){--r:1.8deg;margin-left:clamp(0rem,4vw,2.5rem);animation-delay:.2s}
.placard:nth-child(3){--r:-1.2deg;margin-right:clamp(0rem,2vw,1.2rem);animation-delay:.35s}
.placard:hover,.placard:focus-visible{transform:rotate(0deg) scale(1.02)}
.placard q{display:block;quotes:"“" "”";font-weight:800;font-size:clamp(1.4rem,2.5vw,2rem);line-height:1.06;letter-spacing:-.025em}
.placard span{display:block;margin-top:.8rem;font-weight:600;font-size:.98rem}
@keyframes drop{from{opacity:0;transform:translateY(-36px) rotate(0deg)}}

/* latest */
.latest{padding-bottom:clamp(2.5rem,6vw,5rem)}
.latest-head{display:flex;align-items:end;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:1.2rem}
.latest h2{font-weight:800;font-size:clamp(1.8rem,3.6vw,2.6rem);letter-spacing:-.03em;line-height:1}
.chips{display:flex;gap:.5rem;flex-wrap:wrap}
.filter{font-family:var(--sans);font-weight:700;font-size:.95rem;padding:.4rem .85rem;border:2px solid var(--ink);background:transparent;cursor:pointer}
.filter:hover{background:var(--surface)}
.filter[aria-pressed="true"]{background:var(--c,var(--ink));color:var(--on,var(--paper));border-color:var(--c,var(--ink))}
.row{
  display:grid;grid-template-columns:8.5rem minmax(0,1fr) 11rem;gap:1.5rem;
  padding:1.5rem .5rem;border-top:3px solid var(--line);text-decoration:none;align-items:start;
  transition:background .15s;
}
.row:last-child{border-bottom:3px solid var(--line)}
.row:hover{background:var(--surface)}
.row:hover .row-title{text-decoration:underline;text-decoration-thickness:4px;text-underline-offset:5px;text-decoration-color:var(--c)}
.chip{display:inline-block;justify-self:start;background:var(--c);color:var(--on);font-family:var(--sans);font-weight:700;font-size:.9rem;padding:.2rem .7rem}
.row-main{display:grid;gap:.4rem}
.row-title{font-family:var(--sans);font-weight:800;font-size:clamp(1.45rem,2.7vw,2.1rem);line-height:1.08;letter-spacing:-.03em}
.row-dek{color:var(--muted);max-width:44rem}
.row-meta{display:grid;gap:.1rem;font-size:.98rem;color:var(--muted)}
.row-author{font-family:var(--sans);font-weight:700;color:var(--ink)}
.empty{padding:2rem 0;color:var(--muted)}

/* article */
.article-head{padding-top:clamp(1.5rem,4vw,3rem)}
.back{font-family:var(--sans);font-weight:700;text-decoration:none;display:inline-block;margin-bottom:1.6rem;border-bottom:3px solid var(--gold)}
.article-head h1{font-weight:800;font-size:clamp(2.2rem,5.8vw,4.4rem);line-height:1;letter-spacing:-.04em;max-width:18ch;margin:1rem 0 1.2rem}
.article-dek{font-size:clamp(1.2rem,2.2vw,1.5rem);font-style:italic;color:var(--muted);max-width:36rem;margin:0 0 1.8rem;line-height:1.45}
.byline{display:flex;align-items:center;gap:1rem;padding:1rem 0;border-top:3px solid var(--line);border-bottom:3px solid var(--line);max-width:38rem}
.avatar{flex:none;width:3.4rem;height:3.4rem;display:grid;place-items:center;background:var(--c);color:var(--on);font-family:var(--sans);font-weight:800;font-size:1.6rem}
.byline-text{display:grid;line-height:1.35}
.byline-name{font-family:var(--sans);font-weight:800}
.byline-sub{font-size:.98rem;color:var(--muted)}
.byline-sub span+span{margin-left:1rem}
.article-body{max-width:38rem;padding:2rem 0 1rem;font-size:1.22rem;line-height:1.7}
.article-body p{margin:0 0 1.3rem}
.article-body p:first-child{font-size:1.38rem;line-height:1.55}
.pull{margin:2.2rem 0;padding:.2rem 0 .2rem 1.3rem;border-left:8px solid var(--c);font-family:var(--sans);font-weight:800;font-size:clamp(1.6rem,3.2vw,2.3rem);line-height:1.1;letter-spacing:-.03em}
.panel{background:var(--ink);color:var(--paper);padding:clamp(1.5rem,4vw,2.5rem);margin:2rem 0 3rem;display:grid;gap:1rem;justify-items:start}
.panel h2{font-weight:800;font-size:clamp(1.6rem,3vw,2.3rem);letter-spacing:-.03em;line-height:1.05;max-width:22ch}
.panel p{margin:0;max-width:34rem}
.panel .btn{background:var(--gold);border-color:var(--gold);color:#14101F}
.panel .btn:hover{background:#fff;border-color:#fff;color:#14101F}
.next h2{font-weight:800;font-size:1.6rem;letter-spacing:-.03em;margin-bottom:1rem}
.next{padding-bottom:3rem}

.founder-photo{flex:none;width:5.5rem;height:5.5rem;border-radius:50%;object-fit:cover;background:var(--surface);border:3px solid var(--line);display:grid;place-items:center;text-align:center;font-family:var(--sans);font-weight:700;font-size:.8rem;line-height:1.2;color:var(--muted);padding:.35rem}
img.founder-photo{display:block;padding:0}
div.founder-photo{border-style:dashed}
.founder-photo.sm{width:3.8rem;height:3.8rem;font-size:.7rem}
.founder-byline{gap:1.2rem}
.founder-strip{display:flex;align-items:center;gap:1.2rem;padding:1.2rem .5rem;margin-bottom:2.5rem;border-top:3px solid var(--line);border-bottom:3px solid var(--line);text-decoration:none;transition:background .15s}
.founder-strip:hover{background:var(--surface)}
.founder-strip:hover .strip-title{text-decoration:underline;text-decoration-thickness:4px;text-underline-offset:5px;text-decoration-color:var(--gold)}
.strip-text{display:grid;gap:.1rem}
.strip-label{font-family:var(--sans);font-weight:700;font-size:.95rem;color:var(--muted)}
.strip-title{font-family:var(--sans);font-weight:800;font-size:clamp(1.3rem,2.6vw,1.9rem);letter-spacing:-.03em;line-height:1.1}
.article-body .placeholder{background:var(--gold);color:#14101F;padding:.8rem 1rem;font-family:var(--sans);font-weight:600;font-size:1rem;line-height:1.45}

/* write + about */
.page-head{padding:clamp(2rem,5vw,4rem) 0 1.5rem}
.page-head h1{font-weight:800;font-size:clamp(2.4rem,6.5vw,5.2rem);line-height:.98;letter-spacing:-.045em;max-width:16ch}
.page-head p{max-width:36rem;font-size:1.28rem;margin:1.2rem 0 0;line-height:1.5}
.write-grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:clamp(2rem,5vw,4.5rem);padding-bottom:4rem;align-items:start}
.write-grid h2{font-weight:800;font-size:1.7rem;letter-spacing:-.03em;margin-bottom:1rem}
.steps{list-style:none;margin:0 0 2.2rem;padding:0;display:grid;gap:1.2rem;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:2.6rem 1fr;gap:1rem;align-items:start}
.steps li::before{content:counter(s);display:grid;place-items:center;width:2.6rem;height:2.6rem;background:var(--gold);color:#14101F;font-family:var(--sans);font-weight:800;font-size:1.25rem}
.steps strong{font-family:var(--sans);font-weight:800;display:block}
.guides{margin:0;padding-left:1.2rem;display:grid;gap:.5rem}
.guides strong{font-family:var(--sans);font-weight:800}
form.pitch{background:var(--surface);border:3px solid var(--line);padding:clamp(1.2rem,3vw,2rem);display:grid;gap:1.1rem}
.field{display:grid;gap:.35rem}
.field label{font-family:var(--sans);font-weight:700;font-size:.98rem}
.field .hint{font-size:.95rem;color:var(--muted);line-height:1.4}
.field input,.field select,.field textarea{width:100%;padding:.7rem .8rem;border:2px solid var(--line);background:var(--paper);border-radius:0}
.field textarea{resize:vertical;min-height:9rem}
.check{display:grid;grid-template-columns:auto 1fr;gap:.7rem;align-items:start;font-size:1rem}
.check input{width:1.2rem;height:1.2rem;margin-top:.25rem;accent-color:var(--blue)}
.form-done{display:none;padding:1rem;background:var(--gold);color:#14101F;font-family:var(--sans);font-weight:700}
.form-done.show{display:block}
.prose{max-width:38rem;padding-bottom:3rem}
.prose p{margin:0 0 1.3rem}
.note{border-left:8px solid var(--gold);padding:.4rem 0 .4rem 1.2rem;font-family:var(--sans);font-weight:700;max-width:36rem;margin-bottom:3rem}

/* footer */
.site-footer{border-top:3px solid var(--line);padding:2rem 0 3rem;font-size:1rem}
.site-footer .wrap{display:grid;grid-template-columns:1fr auto;gap:1.5rem;align-items:start}
.site-footer p{margin:.5rem 0 0;color:var(--muted);max-width:34rem}
.site-footer nav{font-size:.98rem}

@media (max-width:860px){
  .hero-grid,.write-grid{grid-template-columns:1fr}
  .row{grid-template-columns:1fr;gap:.7rem}
  .row-meta{grid-auto-flow:column;justify-content:start;gap:1rem}
  .site-footer .wrap{grid-template-columns:1fr}
  .placard:nth-child(2),.placard:nth-child(3){margin-left:0;margin-right:0}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .placard{animation:none;transition:none}
  .btn,.row{transition:none}
}
</style>
</head>

<script>
const TOPICS = {
  education:{label:"Education",cls:"t-education"},
  work:{label:"Work and pay",cls:"t-work"},
  economy:{label:"Economy",cls:"t-economy"},
  transport:{label:"Transport",cls:"t-transport"},
  housing:{label:"Housing",cls:"t-housing"},
  foreign:{label:"Foreign policy",cls:"t-foreign"},
  parties:{label:"Political parties",cls:"t-parties"}
};

const POSTS = [
  {
    slug:"my-rent-takes-more-than-my-loan",
    topic:"education",
    title:"My rent takes more than my loan, and nobody in Westminster seems to know",
    dek:"Student living support was designed around someone who lives at home with a full fridge. Plenty of us do not.",
    author:"First name Last name", role:"Sociology, second year, Sheffield", date:"8 October 2026",
    pull:"Students like me absorb the gap with our time.",
    body:[
      "Every term I do the same sum. My maintenance loan arrives in three instalments, and my rent for the same period is bigger than the first one. The gap gets filled by 22 hours a week behind a bar.",
      "People tell me that is character building. I have not noticed my character building. I have noticed missed seminars, a reading list I skim on the bus and a degree that gets a little less of me every month.",
      "Support for living costs should follow what living costs. That means reviewing it every year against real rents and real food prices, and publishing the working so students can check it. A system that quietly shrinks in value is a decision, even when nobody announces it.",
      "Students from families with money can absorb the gap. Students like me absorb it with our time, and time is the thing a degree needs most. If politicians want social mobility, they can start by properly funding the people who are already trying to move."
    ]
  },
  {
    slug:"my-weekly-shop-is-a-political-question",
    topic:"economy",
    title:"Why my weekly shop is a political question",
    dek:"Rising prices land hardest on people with the least slack, and young earners have almost none.",
    author:"First name Last name", role:"Sixth form, Birmingham", date:"5 October 2026",
    pull:"A pay rise means little if prices rise faster.",
    body:[
      "I get paid every Friday and the money is gone by Wednesday. Bus fare to college, lunch, a phone bill, a contribution to the family shop. None of it is extravagant, and none of it gets smaller.",
      "The economy gets discussed on the news as numbers that move up and down. I think of it as the choice between the big bag of rice and the small one. Politicians who talk about growth rarely say who feels the benefit first.",
      "Young people deserve straight answers on three things: what is being done about food and energy prices, whether younger workers should be paid a lower minimum rate for the same work, and what a first-time saver is meant to do when everything costs more.",
      "An economy that works for people starting out will produce more taxpayers, more savers and more people with the confidence to start something. Treating young earners as an afterthought wastes all of that."
    ]
  },
  {
    slug:"young-party-members-should-help-write-policy",
    topic:"parties",
    title:"Young party members deliver the leaflets. We should help write the policy too.",
    dek:"Youth wings could shape policy if parties gave them a real route in.",
    author:"First name Last name", role:"Law, third year, London", date:"1 October 2026",
    pull:"Give young members a seat where policy gets written.",
    body:[
      "I joined a party’s youth wing at sixteen. In two years I delivered hundreds of leaflets, knocked on doors in the rain and sat through one policy forum where the agenda had already been written.",
      "Parties say they want younger members. What they offer in return is mostly the chores, with the occasional photo for the website.",
      "Youth wings could do more. Give them a guaranteed slot at policy forums, publish how their proposals were handled, and let members under 25 stand for local selection panels without years of service first.",
      "Parties that listen to young members will write better policy on housing, work and transport, because we live with those problems right now. Parties that only ask us to deliver leaflets will keep wondering why we drift away."
    ]
  },
  {
    slug:"unpaid-internships-are-a-tax-on-us",
    topic:"work",
    title:"Unpaid internships are a tax on people like us",
    dek:"The first rung of a political career costs thousands of pounds. Most of us cannot afford the climb.",
    author:"First name Last name", role:"Politics, final year, Leeds", date:"27 September 2026",
    pull:"A fair ladder starts with paying people for their work.",
    body:[
      "Every politics student hears the same advice: get experience. Then the experience on offer turns out to be unpaid, in London, for three months.",
      "Do the sum on that placement. Rent, travel and food in London for twelve weeks add up to thousands, and the pay is a reference letter. Students with a family flat in zone two, or a parent who covers the bills, say yes. The rest of us say no and watch the same jobs go to the same kinds of people.",
      "Parliament and the political parties talk constantly about representation. Their own entry routes sort applicants by bank balance. A fair ladder starts with paying people for their work, at the real living wage at least.",
      "Employers sometimes say they cannot afford it. An organisation that cannot afford to pay an intern is telling us how it values the work."
    ]
  },
  {
    slug:"the-bus-route-that-decides-who-studies",
    topic:"transport",
    title:"The bus route that decides who gets to study",
    dek:"A cut timetable can end a qualification long before any exam does.",
    author:"First name Last name", role:"College, Wolverhampton", date:"22 September 2026",
    pull:"A bus pass costs far less than a missed qualification.",
    body:[
      "My college is nine miles from my house. There is one direct bus, it runs every hour and it stops before my evening classes finish.",
      "Getting to education counts as part of education. When a route is cut or fares rise, a few students drop a course and nobody records why. The loss never shows up in a spreadsheet, though it shows up in our lives.",
      "Young people should have a say in local transport planning, with a seat on the boards that decide routes and timetables. Cheaper fares for under-25s in education would help too, paid for by treating transport as an investment in who can train and work locally.",
      "A bus pass costs far less than a missed qualification."
    ]
  },
  {
    slug:"renting-a-room-with-mould",
    topic:"housing",
    title:"Renting a room with mould showed me that rights only count when you can use them",
    dek:"First-generation renters have nobody to ask when the paperwork starts.",
    author:"First name Last name", role:"Engineering, second year, Nottingham", date:"18 September 2026",
    pull:"Students who are first in the family to rent have nobody to ask.",
    body:[
      "My first student house had black mould across the bathroom ceiling by October. The landlord told me to open a window.",
      "I asked a friend who studies law what my options were. The answer involved forms, deadlines and a council department with a waiting list. Meanwhile I was revising in a room that smelled of damp.",
      "Renters’ rights only count when a tenant can use them. That takes accessible advice, fast council enforcement and protection from being quietly dropped for complaining. Students who are first in the family to rent have nobody to ask.",
      "Universities have a role too. Accrediting landlords and publishing complaint records would give first years something better than a rumour to go on."
    ]
  },
  {
    slug:"foreign-policy-reaches-my-kitchen-table",
    topic:"foreign",
    title:"Foreign policy reaches my kitchen table, so it belongs in the conversation",
    dek:"Wars, trade deals and sanctions shape what young people earn and pay, long before we reach a ballot box.",
    author:"First name Last name", role:"International Relations, first year, Manchester", date:"14 September 2026",
    pull:"A war overseas shows up in my energy bill.",
    body:[
      "When people say foreign policy is distant, I think of my mum’s energy bill. A conflict thousands of miles away changed what we paid to heat our flat, and nobody asked us.",
      "Trade deals, sanctions and defence spending decide jobs, prices and which courses get funding. Young people will live with the results for longer than anyone currently making the decisions.",
      "Parties should explain their positions in plain language: who they would trade with, what they would spend on defence and what they would do when a crisis pushes up household costs. Briefings written for specialists leave most of us out.",
      "Universities can help by running open debates and publishing reading lists that include voices from the countries under discussion. A first-year in a seminar room already has opinions on these issues, and deserves a way to test them."
    ]
  }
];

const view = document.getElementById("view");
let currentTopic = "all";
let CURRENT = location.hash || "#/";
let firstLoad = true;

const readTime = p => Math.max(1, Math.round(p.body.join(" ").split(/\s+/).length / 200));
const bySlug = s => POSTS.find(p => p.slug === s);

function row(p){
  const t = TOPICS[p.topic];
  return `<a class="row ${t.cls}" href="#/article/${p.slug}">
    <span class="chip">${t.label}</span>
    <span class="row-main"><span class="row-title">${p.title}</span><span class="row-dek">${p.dek}</span></span>
    <span class="row-meta"><span class="row-author">${p.author}</span><span>${readTime(p)} min read</span></span>
  </a>`;
}

function listHtml(){
  const items = POSTS.filter(p => currentTopic === "all" || p.topic === currentTopic);
  return items.length ? items.map(row).join("") : `<p class="empty">No pieces on this topic yet. Send us a pitch and yours could be the first.</p>`;
}

function homeView(){
  const placards = POSTS.slice(0,3).map(p => {
    const t = TOPICS[p.topic];
    return `<a class="placard ${t.cls}" href="#/article/${p.slug}"><q>${p.pull}</q><span>${p.author}, ${t.label}</span></a>`;
  }).join("");
  const filters = [`<button class="filter" data-topic="all" aria-pressed="${currentTopic==="all"}">All topics</button>`]
    .concat(Object.entries(TOPICS).map(([k,t]) => `<button class="filter ${t.cls}" data-topic="${k}" aria-pressed="${currentTopic===k}">${t.label}</button>`)).join("");
  return `
  <section class="hero">
    <div class="hero-grid">
      <div>
        <h1>Politics, argued by new writers.</h1>
        <p class="hero-sub">Opinion pieces from students and young writers from a wide range of backgrounds, edited and published under their own names. Read the latest, then pitch your own.</p>
        <div class="cta-row">
          <button class="btn" id="jump">Read the latest</button>
          <a class="btn ghost" href="#/write">Pitch a piece</a>
        </div>
      </div>
      <div class="placards">${placards}</div>
    </div>
  </section>
  <a class="founder-strip" href="#/founder">${photoHtml("sm")}<span class="strip-text"><span class="strip-label">From the founder</span><span class="strip-title">Why I started Grounded Opinion</span></span></a>
  <section class="latest" id="latest" aria-labelledby="latest-h">
    <div class="latest-head">
      <h2 id="latest-h">Latest opinion</h2>
      <div class="chips" role="group" aria-label="Filter by topic">${filters}</div>
    </div>
    <div id="list">${listHtml()}</div>
  </section>`;
}

function articleView(p){
  const t = TOPICS[p.topic];
  const paras = p.body.map((x,i) => {
    const out = `<p>${x}</p>`;
    return i === 1 ? out + `<blockquote class="pull" style="margin-inline:0">${p.pull}</blockquote>` : out;
  }).join("");
  const next = POSTS.filter(x => x.slug !== p.slug).slice(0,2).map(row).join("");
  return `
  <article class="${t.cls}">
    <div class="article-head">
      <a class="back" href="#/">All opinion pieces</a><br>
      <span class="chip">${t.label}</span>
      <h1>${p.title}</h1>
      <p class="article-dek">${p.dek}</p>
      <div class="byline">
        <div class="avatar" aria-hidden="true">${p.author.charAt(0)}</div>
        <div class="byline-text">
          <span class="byline-name">${p.author}</span>
          <span class="byline-sub">${p.role}</span>
          <span class="byline-sub"><span>${p.date}</span><span>${readTime(p)} min read</span></span>
        </div>
      </div>
    </div>
    <div class="article-body">${paras}</div>
  </article>
  <section class="panel" aria-labelledby="cta-h">
    <h2 id="cta-h">Have something to say about this?</h2>
    <p>If you have a view on politics and want a published piece with your name on it, we would like to hear it.</p>
    <a class="btn" href="#/write">Pitch your piece</a>
  </section>
  <section class="next" aria-labelledby="next-h">
    <h2 id="next-h">Keep reading</h2>
    ${next}
  </section>`;
}

function writeView(){
  const opts = Object.entries(TOPICS).map(([k,t]) => `<option value="${t.label}">${t.label}</option>`).join("") + `<option value="Something else">Something else</option>`;
  return `
  <div class="page-head">
    <h1>Write for Grounded Opinion</h1>
    <p>Have something worth saying about politics? You bring the argument, and an editor works with you to sharpen it before it goes live under your name.</p>
  </div>
  <div class="write-grid">
    <div>
      <h2>Why write for us</h2>
      <ul class="guides" style="margin-bottom:2.2rem">
        <li><strong>Real writing experience.</strong> Your piece is edited and published the way a newspaper or magazine would handle it, which is different from coursework.</li>
        <li><strong>A byline for your portfolio.</strong> You get a published article with your name on it to link from your CV, applications and LinkedIn.</li>
        <li><strong>Feedback from an editor.</strong> Someone works through your draft with you, so you learn how to tighten an argument and back up a claim.</li>
        <li><strong>Readers for your argument.</strong> Your view reaches an audience beyond your lecturer or classmates.</li>
      </ul>
      <h2>How it works</h2>
      <ol class="steps">
        <li><div><strong>Send a pitch</strong>Tell us what you want to argue in around 150 words.</div></li>
        <li><div><strong>Talk to an editor</strong>We reply within a week to agree the angle and the length.</div></li>
        <li><div><strong>Write and edit</strong>You draft, an editor gives feedback, and you approve the final version.</div></li>
        <li><div><strong>Publish</strong>Your piece goes live under your name, or a name you choose.</div></li>
      </ol>
      <h2>What we look for</h2>
      <ul class="guides">
        <li>A clear opinion in your own voice.</li>
        <li>Pieces of 500 to 1,000 words, roughly one to two pages.</li>
        <li>Any political subject you care about, whether a policy issue, a political opinion or something else entirely.</li>
      </ul>
    </div>
    <form class="pitch" id="pitch">
      <div class="field"><label for="f-name">Your name</label><input id="f-name" name="name" required autocomplete="name"></div>
      <div class="field"><label for="f-email">Email address</label><input id="f-email" name="email" type="email" required autocomplete="email"></div>
      <div class="field"><label for="f-where">School, college or university</label><input id="f-where" name="where"></div>
      <div class="field"><label for="f-topic">Topic</label><select id="f-topic" name="topic">${opts}</select></div>
      <div class="field"><label for="f-title">Working title</label><input id="f-title" name="title" required></div>
      <div class="field">
        <label for="f-pitch">Your pitch</label>
        <textarea id="f-pitch" name="pitch" required maxlength="900"></textarea>
        <span class="hint">What will you argue, and why does it matter to you?</span>
      </div>
      <label class="check"><input type="checkbox" required><span>I understand an editor may suggest changes before anything is published.</span></label>
      <button class="btn" type="submit">Send pitch</button>
      <div class="form-done" id="done" role="status">Thanks for submitting a pitch to Grounded Opinion. A member of the team will be in touch with you shortly to discuss your ideas.<br>Best wishes,<br>The Grounded team</div>
    </form>
  </div>`;
}

function aboutView(){
  return `
  <div class="page-head">
    <h1>A place to get your first piece published</h1>
  </div>
  <div class="prose">
    <p>Grounded Opinion publishes pieces on politics by young writers, many of them still in school, college or university. Our contributors come from a wide range of backgrounds, and they bring views and experiences that are easy to miss in the usual political debate.</p>
    <p>For most of our writers this is a first published piece, so the editing is part of the point. Every piece goes through an editor who works with the writer on structure, evidence and length. The argument stays the writer’s own.</p>
    <p>We publish views from across the political spectrum, provided they are argued honestly and with respect for other people.</p>
    <p><a class="btn ghost" href="#/founder">Read the founder’s note</a></p>
  </div>
  <p class="note">This prototype uses sample articles and authors to show the design.</p>`;
}

function photoHtml(size){
  if (FOUNDER.photo) return `<img class="founder-photo ${size}" src="${FOUNDER.photo}" alt="Photo of ${FOUNDER.name}">`;
  return `<div class="founder-photo ${size}" role="img" aria-label="Space for the founder’s photo"><span>${size === "sm" ? "Photo" : "Add your photo"}</span></div>`;
}

function founderView(){
  return `
  <article class="t-education">
    <div class="article-head">
      <a class="back" href="#/about">About</a><br>
      <span class="chip">From the founder</span>
      <h1>Why I started Grounded Opinion</h1>
      <p class="article-dek">A founder’s note on creating an accessible space for people from underrepresented backgrounds to publish their work on politics.</p>
      <div class="byline founder-byline">
        ${photoHtml("")}
        <div class="byline-text"><span class="byline-name">${FOUNDER.name}</span><span class="byline-sub">${FOUNDER.line}</span></div>
      </div>
    </div>
    <div class="article-body">
      <p>I love politics, and I have been lucky to see it from a few different angles: working in Parliament for the former Shadow Chancellor, doing policy research at Citizens Advice and now working for a political consultancy in London. The same passion for politics, policy and argument that has driven me to work in each of these places drives my belief that it matters that people can have their say on politics in an accessible way, and that lived experience is central to shaping strong political arguments. It is key that young people from underrepresented backgrounds have a space where their voices can be heard.</p>
      <p>I came into politics from a single-parent working class family, and I remember how hard it felt to get a foot in the door without the contacts or confidence that come with family connections. I want young people interested in politics, from all backgrounds, to have a clearer route than I did.</p>
      <p>Grounded Opinion is my contribution to help build that clearer route. It gives students and young writers a place to publish their first political opinion pieces, with an editor working alongside them and a byline they can use in a portfolio. Writing experience is hard to come by, and the first piece is often the hardest to land.</p>
      <blockquote class="pull" style="margin-inline:0">Lived experience gives perspective and sharpens arguments.</blockquote>
      <p>Debate also improves when it hears from people who disagree for different reasons. We publish views from across the political spectrum, provided they are argued honestly and respectfully. The aim is a wider range of people making the arguments, so readers meet ideas they would not usually come across.</p>
      <p>If you have something worth saying about politics, I would like to read it. Send a pitch through the Write for us page and an editor will get back to you.</p>
    </div>
  </article>
  <section class="panel" aria-labelledby="cta-h">
    <h2 id="cta-h">Have something worth saying?</h2>
    <p>Pitch an idea and get a published piece with your name on it.</p>
    <a class="btn" href="#/write">Pitch your piece</a>
  </section>`;
}

const ROUTES = [
  [/^#\/article\/(.+)$/, m => { const p = bySlug(m[1]); return p ? {html:articleView(p), title:p.title+" | Grounded Opinion", nav:"home"} : null; }],
  [/^#\/write$/, () => ({html:writeView(), title:"Write for us | Grounded Opinion", nav:"write", after:bindForm})],
  [/^#\/founder$/, () => ({html:founderView(), title:"Why I started Grounded Opinion | Grounded Opinion", nav:"about"})],
  [/^#\/about$/, () => ({html:aboutView(), title:"About | Grounded Opinion", nav:"about"})],
  [/^(#\/?)?$/, () => ({html:homeView(), title:"Grounded Opinion", nav:"home", after:bindHome})]
];

function route(){
  const h = CURRENT;
  let res = null;
  for (const [re, fn] of ROUTES){ const m = h.match(re); if (m){ res = fn(m); if (res) break; } }
  if (!res) res = {html:`<div class="page-head"><h1>Page not found</h1><p><a href="#/">Go back to the latest pieces</a></p></div>`, title:"Not found | Grounded Opinion", nav:""};
  view.innerHTML = res.html;
  document.title = res.title;
  document.querySelectorAll("nav a[data-nav]").forEach(a => {
    if (a.dataset.nav === res.nav) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current");
  });
  if (res.after) res.after();
  if (!firstLoad){ window.scrollTo(0,0); document.getElementById("main").focus({preventScroll:true}); }
  firstLoad = false;
}

function bindHome(){
  const jump = document.getElementById("jump");
  if (jump) jump.addEventListener("click", () => document.getElementById("latest").scrollIntoView());
  document.querySelectorAll(".filter").forEach(b => b.addEventListener("click", () => {
    currentTopic = b.dataset.topic;
    document.querySelectorAll(".filter").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    document.getElementById("list").innerHTML = listHtml();
  }));
}

function bindForm(){
  const f = document.getElementById("pitch");
  f.addEventListener("submit", e => {
    e.preventDefault();
    const d = new FormData(f);
    const body = [
      "Name: " + d.get("name"),
      "Email: " + d.get("email"),
      "School, college or university: " + (d.get("where") || "Not given"),
      "Topic: " + d.get("topic"),
      "Working title: " + d.get("title"),
      "",
      "Pitch:",
      d.get("pitch")
    ].join("\n");
    const href = "mailto:" + ["Josh.tking66", "icloud.com"].join("@") + "?subject=" + encodeURIComponent("Pitch: " + d.get("title")) + "&body=" + encodeURIComponent(body);
    document.getElementById("done").classList.add("show");
    window.location.href = href;
  });
}

function navigate(h){
  CURRENT = h;
  try { if (location.hash !== h) location.hash = h; } catch (e) {}
  route();
}
document.addEventListener("click", e => {
  const a = e.target.closest && e.target.closest('a[href^="#/"]');
  if (!a || e.defaultPrevented || e.metaKey || e.ctrlKey || e.shiftKey || e.button > 0) return;
  e.preventDefault();
  navigate(a.getAttribute("href"));
});
window.addEventListener("hashchange", () => {
  if (location.hash !== CURRENT) { CURRENT = location.hash || "#/"; route(); }
});
route();
</script>
